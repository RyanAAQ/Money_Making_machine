# =============================================================================
# APPLICATION NAME
# =============================================================================
spring.application.name=MoneyMakingMachine

# =============================================================================
# DATABASE CONNECTION
# =============================================================================
# These values are read from environment variables so passwords are never
# hard-coded in source code.
#
# You must set these environment variables before starting the application:
#   DB_HOST      → the machine running PostgreSQL (usually: localhost)
#   DB_PORT      → PostgreSQL port (default: 5432)
#   DB_NAME      → the name of your database (e.g. quickinvoice)
#   DB_USERNAME  → your PostgreSQL username (e.g. postgres)
#   DB_PASSWORD  → your PostgreSQL password
#
# In IntelliJ: Run → Edit Configurations → Environment variables
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# update  → Hibernate checks the DB on startup and adds/alters columns to match
#           your entities. Safe to use during development.
#           NEVER use "create" or "create-drop" with real data — they wipe the DB.
spring.jpa.hibernate.ddl-auto=update

# Tells Hibernate we are using PostgreSQL so it generates the correct SQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Prints every SQL statement Hibernate runs to the console.
# Useful while learning. Set to false when you no longer need it.
spring.jpa.show-sql=true

# Formats the printed SQL so it is easier to read
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# SERVER
# =============================================================================
# The port your application listens on. Default is 8080.
# Change this if port 8080 is already in use on your machine.
server.port=8080
